<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <title>AMSS Portal</title>

  <style>
    /* ---------- Background ---------- */
    body {
      font-family: 'Lucida Sans', Verdana, sans-serif;
      background: url("img1.png") center / cover no-repeat;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Dark Mode */
    body.dark-mode {
      background: #121212;
      color: #fff;
    }

    /* Hero */
    .hero {
      background: rgba(17, 111, 75, 0.6);
      color: white;
      padding: 1rem 0.5rem;
      text-align: center;
      max-width: 500px;
      margin: auto;
       border-bottom: 1rem solid rgb(28, 214, 28);
  border-right: 1rem solid rgb(28, 214, 28);
  border-bottom-right-radius: 1rem;
      border-top: 1rem solid rgb(9, 245, 245);
  border-left: 1rem solid rgb(210, 18, 79);
  border-bottom-right-radius: 2rem;
    }

    /* Start Button */
    .start-btn {
      padding: 0.75rem 2.5rem;
      font-weight: bold;
      border-radius: 50px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .start-btn:hover {
      transform: scale(1.2);
      box-shadow: 0 8px 20px rgba(37, 95, 4, 0.3);
    }

    /* Spinner hidden by default */
    .spinner-border {
      display: none;
    }

    /* Mobile-only tweaks */
    @media (max-width: 576px) {
      .hero {
        padding: 1rem 1rem;
      }
      .start-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Dark Mode Toggle -->
  <div class="text-end p-3">
    <button id="darkToggle" class="btn btn-outline-light btn-sm">
      <i class="bi bi-moon-stars"></i> Dark Mode
    </button>
  </div>

  <!-- Hero -->
  <header class="hero">
    <h1 class="fw-bold">Welcome to AMSS Teacher  Login Page </h1>
    <p class="lead">Empowering Education, Inspiring Futures</p>
  </header>

  <!-- Main -->
  <main class="container text-center my-5">
    <a id="startBtn"
       href="https://script.google.com/macros/s/AKfycbyaEvceSgS2v6zQYvbBCa2aPxOb8RlD06eSqDWvWL0rSVZYAtxYkzw5e5FLRnTAlOWo/exec"
       class="btn btn-info start-btn">

      <span class="btn-text">
        <i class="bi bi-play-circle"></i> Start
      </span>

      <span class="spinner-border spinner-border-sm ms-2" role="status"></span>
    </a>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ---------- Loading Spinner ---------- */
    const startBtn = document.getElementById("startBtn");
    const spinner = startBtn.querySelector(".spinner-border");
    const btnText = startBtn.querySelector(".btn-text");

    startBtn.addEventListener("click", function () {
      spinner.style.display = "inline-block";
      btnText.textContent = "Loading...";
    });

    /* ---------- Dark Mode Toggle ---------- */
    const toggle = document.getElementById("darkToggle");

    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      toggle.innerHTML = document.body.classList.contains("dark-mode")
        ? '<i class="bi bi-sun"></i> Light Mode'
        : '<i class="bi bi-moon-stars"></i> Dark Mode';
    });
  </script>

</body>
</html>
