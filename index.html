<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Preload images for fast loading -->
<link rel="preload" href="img1.png" as="image">
<link rel="preload" href="logo.png" as="image">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<title>AMSS Portal</title>

<style>
/* ---------- FAST BACKGROUND ---------- */
html {
 background: #049235; /* fallback color */
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Lucida Sans', Verdana, sans-serif;

  /* background image + subtle green overlay */
  background:
    url("img1.png") no-repeat center center fixed;
  background-size: cover;
  background-attachment: fixed;

  color: #ffffff;
  animation: subtleMove 15s ease-in-out infinite;
  transition: background-color 0.3s, color 0.3s;
}

/* subtle animated background movement 
@keyframes subtleMove {
  0% { background-position: center center; }
  50% { background-position: center 10%; }
  100% { background-position: center center; }
}

/* Dark Mode */
body.dark-mode {
  background:
    linear-gradient(rgba(30, 3, 3, 0.95), rgba(18,18,18,0.95)),
    url("img1.png") no-repeat center center fixed;
  background-size: cover;
  color: #ffffff;
}

/* Dark Mode button */
#darkToggle {
  border: 1px solid white;
}

/* Hero Section */
.hero {
  background: rgba(9, 107, 69, 0.5);
  max-width: 520px;
  margin: 2rem auto 1rem auto;
  padding: .2rem;
  text-align: center;

  border-bottom: 1rem solid rgb(28,167,214);
  border-right: 1rem solid rgb(214,56,28);
  border-top: 1rem solid rgb(237,226,11);
  border-left: 1rem solid rgb(37,210,18);
  border-bottom-right-radius: 2rem;
}

/* School Logo */
.school-logo {
  width: 90px;
  height: auto;
  margin-bottom: 8px;
}

/* Start Button */
.start-btn {
  padding: 0.8rem 2.5rem;
  font-weight: bold;
  border-radius: 50px;
  transition: transform 0.3s, box-shadow 0.3s;
}

.start-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 20px rgba(37, 96, 3, 0.3);
}

/* Spinner hidden initially */
.spinner-border {
  display: none;
}

/* Mobile tweaks */
@media (max-width:576px){
  .hero{ padding: 1rem; }
  .start-btn{ width:100%; }
}
</style>
</head>

<body>

<!-- Dark Mode Toggle -->
<div class="text-end p-3">
  <button id="darkToggle" class="btn btn-outline-light btn-sm">
    <i class="bi bi-moon-stars"></i> Dark Mode
  </button>
</div>

<!-- Hero Section -->
<header class="hero">

  <!-- School Logo -->
  <img src="logo.png" class="school-logo" alt="School Logo">

  <!-- School Name -->
  <h1 class="fw-bold mt-2">AWOLIA-MSS</h1>

  <!-- Welcome Message -->
  <p class="lead mb-1">Empowering Education, Inspiring Futures</p>

</header>

<!-- Main Section -->
<main class="container text-center my-3">
  <a id="startBtn"
     href="https://script.google.com/macros/s/AKfycbyaEvceSgS2v6zQYvbBCa2aPxOb8RlD06eSqDWvWL0rSVZYAtxYkzw5e5FLRnTAlOWo/exec"
     class="btn btn-info start-btn text-white">

    <span class="btn-text">
      Start
    </span>

    <span class="spinner-border spinner-border-sm ms-2" role="status"></span>
  </a>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ----- START BUTTON SPINNER -----
const startBtn = document.getElementById("startBtn");
const spinner = startBtn.querySelector(".spinner-border");
const btnText = startBtn.querySelector(".btn-text");

startBtn.addEventListener("click",()=>{
  spinner.style.display = "inline-block";
  btnText.textContent = "Loading...";
});

// ----- DARK MODE TOGGLE -----
const toggle = document.getElementById("darkToggle");
toggle.addEventListener("click",()=>{
  document.body.classList.toggle("dark-mode");
  toggle.innerHTML =
    document.body.classList.contains("dark-mode")
      ? '<i class="bi bi-sun"></i> Light Mode'
      : '<i class="bi bi-moon-stars"></i> Dark Mode';
});

</script>

</body>
</html>
