<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Preload background to avoid white flash -->
  <link rel="preload" href="img1.png" as="image">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <title>AMSS Portal</title>

  <style>
    /* Prevent white flash */
    html {
      background: #1f7d40;
    }

    body {
      font-family: 'Lucida Sans', Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;

      /* Fast background: image + green overlay */
      background:
        linear-gradient(rgba(50,168,82,0.88), rgba(31,125,64,0.88)),
        url("img1.png") no-repeat center center fixed;

      background-size: cover;
      transition: background-color 0.3s, color 0.3s;
      color: #ffffff;
    }

    /* Dark Mode */
    body.dark-mode {
      background:
        linear-gradient(rgba(18,18,18,0.95), rgba(18,18,18,0.95)),
        url("img1.png") no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
    }

    /* Dark mode button */
    #darkToggle {
      border: 1px solid white;
    }

    /* Hero section */
    .hero {
      background: rgba(17, 111, 75, 0.75);
      color: white;
      padding: 1rem 0.5rem;
      text-align: center;
      max-width: 500px;
      margin: 2rem auto 1rem auto;

         border-bottom: 1rem solid rgb(28, 167, 214);
      border-right: 1rem solid rgb(214, 56, 28);
      border-top: 1rem solid rgb(237, 226, 11);
      border-left: 1rem solid rgb(37, 210, 18);
      border-bottom-right-radius: 2rem;
    }

    /* Start button */
    .start-btn {
      padding: 0.75rem 2.5rem;
      font-weight: bold;
      border-radius: 50px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .start-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(37, 95, 4, 0.3);
    }

    /* Spinner hidden initially */
    .spinner-border {
      display: none;
    }

    /* Mobile improvements */
    @media (max-width: 576px) {
      .hero {
        padding: 1rem 1rem;
      }
      .start-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Dark Mode Toggle -->
  <div class="text-end p-3">
    <button id="darkToggle" class="btn btn-outline-light btn-sm">
      <i class="bi bi-moon-stars"></i> Dark Mode
    </button>
  </div>

  <!-- Hero Section -->
  <header class="hero">
    <h1 class="fw-bold">Welcome to AMSS Teacher Login</h1>
    <p class="lead">Empowering Education, Inspiring Futures</p>
  </header>

  <!-- Main Section -->
  <main class="container text-center my-5">
    <a id="startBtn"
       href="https://script.google.com/macros/s/AKfycbyaEvceSgS2v6zQYvbBCa2aPxOb8RlD06eSqDWvWL0rSVZYAtxYkzw5e5FLRnTAlOWo/exec"
       class="btn btn-info start-btn text-white">

      <span class="btn-text">
        <i class="bi bi-play-circle"></i> Start
      </span>

      <span class="spinner-border spinner-border-sm ms-2" role="status"></span>
    </a>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ---------- Loading Spinner ----------
    const startBtn = document.getElementById("startBtn");
    const spinner = startBtn.querySelector(".spinner-border");
    const btnText = startBtn.querySelector(".btn-text");

    startBtn.addEventListener("click", function () {
      spinner.style.display = "inline-block";
      btnText.textContent = "Loading...";
    });

    // ---------- Dark Mode Toggle ----------
    const toggle = document.getElementById("darkToggle");

    toggle.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");

      toggle.innerHTML = document.body.classList.contains("dark-mode")
        ? '<i class="bi bi-sun"></i> Light Mode'
        : '<i class="bi bi-moon-stars"></i> Dark Mode';
    });
  </script>

</body>
</html>
