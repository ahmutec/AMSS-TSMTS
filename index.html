<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Preload images for fast loading -->
<link rel="preload" href="img1.png" as="image">
<link rel="preload" href="logo.png" as="image">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<title>AMSS Portal</title>

<style>
/* ---------- IMMEDIATE BACKGROUND ---------- */
html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
   font-family: Georgia, "Times New Roman", serif;
  background: url("img1.png") center/cover no-repeat fixed;
  color: #ffffff;
  overflow-x: hidden;
  transition: background-color 0.3s, color 0.3s;
}

/* Dark Mode */
body.dark-mode {
  background: linear-gradient(rgba(18,18,18,0.85), rgba(18,18,18,0.85)), 
              url("img1.png") center/cover no-repeat fixed;
  color: #ffffff;
}

/* Fixed circular logo at top-left */
#logo-fixed {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #10b981;
  z-index: 1000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Dark Mode button */
#darkToggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  border: 1px solid white;
}

/* Hero Section */
.hero {
  background: rgba(1,14,9,0.5);
  max-width: 500px;
  margin: 7rem auto 1rem auto;
  padding: 1rem;
  text-align: center;

  border-bottom: 1rem solid rgb(28,167,214);
  border-right: 1rem solid rgb(214,56,28);
  border-top: 1rem solid rgb(237,226,11);
  border-left: 1rem solid rgb(37,210,18);
  border-bottom-right-radius: 2rem;
}

.hero p {
  font-family: Georgia, "Times New Roman", serif;
  margin: 0.5rem 0;
}

/* Start Button */
.start-btn {
  padding: 0.8rem 2rem;
  font-weight: bold;
  border-radius: 50px;
  font-family: Georgia, "Times New Roman", serif;
  transition: transform 0.3s, box-shadow 0.3s;
  width: 150px;      /* Fixed width on desktop */
  max-width: 80%;    /* Shrinks on smaller screens */
}

.start-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 20px rgba(37, 96, 3, 0.3);
}

/* Spinner hidden initially */
.spinner-border {
  display: none;
}

/* Responsive tweaks */
@media (max-width: 576px) {
  .start-btn {
    width: 40%;       /* Mobile-friendly width */
    padding: 0.6rem 1.5rem;
  }
}
</style>
</head>

<body>

<!-- Fixed School Logo -->
<img src="logo.png" id="logo-fixed" alt="School Logo">

<!-- Dark Mode Toggle -->
<button id="darkToggle" class="btn btn-outline-light btn-sm">
  <i class="bi bi-moon-stars"></i> Dark Mode
</button>

<!-- Hero Section -->
<header class="hero">
  <h1 class="fw-bold mt-2">AWOLIA-MSS</h1>
  <p>Teachers are the mentors of tomorrow's leaders.</p>
</header>

<!-- Main Section -->
<main class="container text-center my-3">
  <a id="startBtn"
     href="https://script.google.com/macros/s/AKfycbyaEvceSgS2v6zQYvbBCa2aPxOb8RlD06eSqDWvWL0rSVZYAtxYkzw5e5FLRnTAlOWo/exec"
     class="btn btn-info start-btn text-white d-block mx-auto">
    <span class="btn-text">Start</span>
    <span class="spinner-border spinner-border-sm ms-2" role="status"></span>
  </a>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ----- START BUTTON SPINNER -----
const startBtn = document.getElementById("startBtn");
const spinner = startBtn.querySelector(".spinner-border");
const btnText = startBtn.querySelector(".btn-text");

startBtn.addEventListener("click", () => {
  spinner.style.display = "inline-block";
  btnText.textContent = "Loading...";
});

// ----- DARK MODE TOGGLE -----
const toggle = document.getElementById("darkToggle");
toggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  toggle.innerHTML =
    document.body.classList.contains("dark-mode")
      ? '<i class="bi bi-sun"></i> Light Mode'
      : '<i class="bi bi-moon-stars"></i> Dark Mode';
});
</script>

</body>
</html>
